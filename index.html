
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R Playground</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #ECEFF4;
      color: #2E3440;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 720px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }
    h2 { margin-top: 0; }
    textarea, #output {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 7px;
      font-family: monospace;
      font-size: 15px;
    }
    textarea {
      border: 1px solid #D8DEE9;
      min-height: 130px;
    }
    pre {
      background: #2E3440;
      color: #ECEFF4;
      min-height: 65px;
      white-space: pre-wrap;
    }
    button {
      background: #5E81AC;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #reset { background: #4C566A; }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }
    #status { color: #4C566A; }
    
    #plots {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#plots canvas {
  display: block;
  width: 100%;
  max-width: 600px;
  height: auto;
  border: 1px solid #D8DEE9;
  border-radius: 6px;
}


/* Nord-themed R code editor */

.CodeMirror {
  height: 180px;
  border: 1px solid #D8DEE9;
  border-radius: 7px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 15px;
  line-height: 1.5;
  background: #ECEFF4;
  color: #2E3440;
}

.CodeMirror-gutters {
  background: #E5E9F0;
  border-right: 1px solid #D8DEE9;
}

.CodeMirror-linenumber {
  color: #4C566A;
}

.CodeMirror-cursor {
  border-left: 2px solid #5E81AC;
}

.CodeMirror-selected {
  background: #D8DEE9 !important;
}

/* Syntax colors */
.cm-s-default .cm-comment  { color: #6A768A; }
.cm-s-default .cm-string   { color: #A05A62; }
.cm-s-default .cm-number   { color: #8B6BA8; }
.cm-s-default .cm-keyword  { color: #5E81AC; }
.cm-s-default .cm-operator { color: #5E81AC; }
.cm-s-default .cm-variable { color: #2E3440; }
.cm-s-default .cm-def      { color: #487C86; }
.cm-s-default .cm-builtin  { color: #487C86; }
.cm-s-default .cm-atom     { color: #8B6BA8; }

/* Fix CodeMirror line spacing */
.CodeMirror {
  height: 180px;
  line-height: 1.4;
  font-size: 15px;
}

.CodeMirror pre.CodeMirror-line,
.CodeMirror pre.CodeMirror-line-like {
  padding: 0 4px;
  margin: 0;
  line-height: inherit;
  min-height: 0;
}

.CodeMirror-code {
  line-height: inherit;
}
    
  </style>

<!-- CodeMirror editor -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js">
</script>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/r/r.min.js">
</script>
  
</head>
<body>
<main>
  <h2>R Playground</h2>
  <p>Change the code and click Run Code.</p>
  <p id="status">Loading R...</p>

  <textarea id="code" spellcheck="false">x <- 10
x * 2</textarea>

  <div class="controls">
    <button id="reset">Reset</button>
    <button id="run" disabled>Run Code</button>
  </div>

<h3>Console</h3>
<pre id="output">Initializing R...</pre>

<h3>Plots</h3>
<div id="plots"></div>
</main>

<script type="module">
  import { WebR } from
    "https://webr.r-wasm.org/latest/webr.mjs";


const editor = CodeMirror.fromTextArea(
  document.getElementById("code"),
  {
    mode: "r",
    lineNumbers: true,
    lineWrapping: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      Tab: cm => cm.execCommand("insertSoftTab")
    }
  }
);

const output = document.getElementById("output");
  
  const plots = document.getElementById("plots");
  const status = document.getElementById("status");
  const run = document.getElementById("run");
  const reset = document.getElementById("reset");

// Exercise library
const exercises = {
  hello: `print("Hello, R!")`,

  math: `2 + 3 * 4
(2 + 3) * 4`,

  objects: `x <- 10
x * 2`,

  vectors: `x <- c(10, 20, 30, 40)
x
length(x)`,

  stats: `x <- c(10, 20, 30, 40)
mean(x)
sum(x)
sd(x)`, 

  histogram: `x <- rnorm(100)
hist(x,
     col = "#88C0D0",
     border = "white",
     main = "My First Histogram",
     xlab = "Value")`
};

// Read the exercise name from the URL
const params = new URLSearchParams(window.location.search);
const exercise = params.get("exercise") || "hello";

// Select the exercise, defaulting to hello
const initialCode = Object.hasOwn(exercises, exercise)
  ? exercises[exercise]
  : exercises.hello;

// Display the selected code
editor.setValue(initialCode);

  reset.onclick = () => {
    editor.setValue(initialCode);
    output.textContent = "Ready.";
  };

  try {
    const webR = new WebR({
      channelType: "PostMessage"
    });

    await webR.init();
    const shelter = await new webR.Shelter();

    status.textContent = "R is ready!";
    output.textContent = "Ready.";
    run.disabled = false;


run.onclick = async () => {
  run.disabled = true;
  output.textContent = "Running...";
  plots.replaceChildren();

  try {
    const result = await shelter.captureR(
      editor.getValue(),
      {
        withAutoprint: true,
        captureGraphics: {
          width: 600,
          height: 400
        }
      }
    );

    // Display console output
    const messages = result.output.map(
      item => String(item.data)
    );

    output.textContent =
      messages.join("\n") || "(No text output)";

    // Display captured R graphics
    for (const image of result.images ?? []) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0);

      plots.appendChild(canvas);
    }

    if (!result.images?.length) {
      plots.textContent = "No plots generated.";
    }

  } catch (error) {
    output.textContent = String(error);
  } finally {
    await shelter.purge();
    run.disabled = false;
  }
};

  } catch (error) {
    status.textContent = "R failed to load.";
    output.textContent = String(error);
  }
</script>
</body>
</html>
