
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R Playground</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #ECEFF4;
      color: #2E3440;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 720px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }
    h2 { margin-top: 0; }
    textarea, pre {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 7px;
      font-family: monospace;
      font-size: 15px;
    }
    textarea {
      border: 1px solid #D8DEE9;
      min-height: 130px;
    }
    pre {
      background: #2E3440;
      color: #ECEFF4;
      min-height: 65px;
      white-space: pre-wrap;
    }
    button {
      background: #5E81AC;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #reset { background: #4C566A; }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }
    #status { color: #4C566A; }
  </style>
</head>
<body>
<main>
  <h2>R Playground</h2>
  <p>Change the code and click Run Code.</p>
  <p id="status">Loading R...</p>

  <textarea id="code" spellcheck="false">x <- 10
x * 2</textarea>

  <div class="controls">
    <button id="reset">Reset</button>
    <button id="run" disabled>Run Code</button>
  </div>

  <h3>Console</h3>
  <pre id="output">Initializing R...</pre>
</main>

<script type="module">
  import { WebR } from
    "https://webr.r-wasm.org/latest/webr.mjs";

  const editor = document.getElementById("code");
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  const run = document.getElementById("run");
  const reset = document.getElementById("reset");

// Exercise library
const exercises = {
  hello: `print("Hello, R!")`,

  math: `2 + 3 * 4
(2 + 3) * 4`,

  objects: `x <- 10
x * 2`,

  vectors: `x <- c(10, 20, 30, 40)
x
length(x)`,

  stats: `x <- c(10, 20, 30, 40)
mean(x)
sum(x)
sd(x)`
};

// Read the exercise name from the URL
const params = new URLSearchParams(window.location.search);
const exercise = params.get("exercise") || "hello";

// Select the exercise, defaulting to hello
const initialCode = Object.hasOwn(exercises, exercise)
  ? exercises[exercise]
  : exercises.hello;

// Display the selected code
editor.value = initialCode;

  reset.onclick = () => {
    editor.value = initialCode;
    output.textContent = "Ready.";
  };

  try {
    const webR = new WebR({
      channelType: "PostMessage"
    });

    await webR.init();
    const shelter = await new webR.Shelter();

    status.textContent = "R is ready!";
    output.textContent = "Ready.";
    run.disabled = false;

    run.onclick = async () => {
      run.disabled = true;
      output.textContent = "Running...";

      try {
        const result = await shelter.captureR(
          editor.value,
          { withAutoprint: true }
        );

        const messages = result.output.map(
          item => String(item.data)
        );

        output.textContent =
          messages.join("\n") || "(No text output)";
      } catch (error) {
        output.textContent = String(error);
      } finally {
        await shelter.purge();
        run.disabled = false;
      }
    };
  } catch (error) {
    status.textContent = "R failed to load.";
    output.textContent = String(error);
  }
</script>
</body>
</html>
